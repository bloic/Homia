services:
  frankenphp:
    build:
      context: .
      dockerfile: Docker/frankenphp/Dockerfile
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    volumes:
      - ./App:/app
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - SERVER_NAME=${SERVER_NAME:-localhost}
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - api-network
      
networks:
  api-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  db_data: